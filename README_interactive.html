<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telecom Postpaid Plan Eligibility Bootcamp</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #1f2328;
      background: #ffffff;
    }

    /* ── sticky name bar ── */
    #name-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #1f2328;
      color: #ffffff;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    #name-bar label { font-size: 14px; white-space: nowrap; }
    #name-input {
      padding: 6px 10px;
      font-size: 14px;
      border: 1px solid #555;
      border-radius: 4px;
      background: #2d333b;
      color: #fff;
      width: 200px;
      outline: none;
    }
    #name-input::placeholder { color: #aaa; }
    #name-input:focus { border-color: #3b82d4; }
    #name-badge {
      font-size: 13px;
      color: #aaa;
      margin-left: 4px;
    }
    #name-badge span {
      color: #58a6ff;
      font-weight: 600;
    }

    /* ── content ── */
    #content {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    h1 { font-size: 1.9em; margin: 0.6em 0 0.4em; }
    h2 { font-size: 1.4em; margin: 1.6em 0 0.5em; padding-bottom: 6px; border-bottom: 1px solid #e5e7eb; }
    h3 { font-size: 1.15em; margin: 1.4em 0 0.4em; }
    h4 { font-size: 1em; margin: 1.2em 0 0.3em; }

    p { margin: 0.5em 0; }
    ul, ol { margin: 0.5em 0 0.5em 1.6em; }
    li { margin: 0.2em 0; }

    a { color: #3b82d4; text-decoration: none; }
    a:hover { text-decoration: underline; }

    hr { border: none; border-top: 1px solid #e5e7eb; margin: 1.6em 0; }

    blockquote {
      border-left: 4px solid #3b82d4;
      margin: 0.8em 0;
      padding: 6px 14px;
      background: #f7f8fa;
      color: #57606a;
      border-radius: 0 4px 4px 0;
    }

    /* ── code ── */
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.87em;
      background: #f0f1f3;
      border: 1px solid #e5e7eb;
      border-radius: 3px;
      padding: 1px 5px;
    }
    pre {
      background: #1f2328;
      color: #e6edf3;
      border-radius: 6px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0.8em 0;
    }
    pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.85em;
      color: inherit;
    }

    /* ── highlight placeholders ── */
    .placeholder {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
      border-radius: 3px;
      padding: 1px 4px;
      font-weight: 600;
    }
    .filled {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #34d399;
      border-radius: 3px;
      padding: 1px 4px;
      font-weight: 600;
    }

    /* ── tables ── */
    table { border-collapse: collapse; width: 100%; margin: 0.8em 0; font-size: 0.93em; }
    th { background: #f7f8fa; font-weight: 600; }
    th, td { border: 1px solid #e5e7eb; padding: 7px 12px; text-align: left; }
    tr:nth-child(even) td { background: #fafafa; }

    /* ── details/summary ── */
    details { margin: 0.6em 0; border: 1px solid #e5e7eb; border-radius: 4px; padding: 6px 12px; }
    summary { cursor: pointer; font-weight: 600; }

    img { max-width: 100%; border-radius: 4px; margin: 6px 0; }

    #loading { color: #57606a; padding: 40px 24px; font-size: 1.1em; }
    #error { color: #cf222e; padding: 40px 24px; }
  </style>
</head>
<body>

<div id="name-bar">
  <label for="name-input">Your last name:</label>
  <input id="name-input" type="text" placeholder="e.g. ahmed" autocomplete="off" />
  <span id="name-badge">All <code style="background:#333;border-color:#555;color:#fff">&lt;your_last_name&gt;</code> will update live</span>
</div>

<div id="content">
  <p id="loading">Loading lab guide…</p>
</div>

<script>
  const PLACEHOLDER = '<your_last_name>';
  let rawMarkdown = '';

  // ── fetch README.md from same folder ──
  fetch('./README.md')
    .then(r => {
      if (!r.ok) throw new Error('Could not load README.md — make sure this HTML file is in the same folder.');
      return r.text();
    })
    .then(text => {
      rawMarkdown = text;
      render(document.getElementById('name-input').value.trim());
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        `<p id="error">⚠️ ${err.message}</p>`;
    });

  // ── render with substitution ──
  function render(lastName) {
    const substituted = lastName
      ? rawMarkdown.replaceAll(PLACEHOLDER, lastName)
      : rawMarkdown;

    const html = marked.parse(substituted);

    // highlight remaining placeholders or filled values
    const highlighted = lastName
      ? html.replace(/\b([a-z_]+_)?([a-zA-Z]+)\b/g, (m) => m) // no-op, already replaced
      : html.replace(/&lt;your_last_name&gt;/g,
          `<span class="placeholder">&lt;your_last_name&gt;</span>`);

    document.getElementById('content').innerHTML = highlighted;

    // update badge
    const badge = document.getElementById('name-badge');
    if (lastName) {
      badge.innerHTML = `Showing as: <span>${lastName}</span>`;
    } else {
      badge.innerHTML = `All <code style="background:#333;border-color:#555;color:#fff">&lt;your_last_name&gt;</code> will update live`;
    }
  }

  // ── live update on input ──
  let debounce;
  document.getElementById('name-input').addEventListener('input', function () {
    clearTimeout(debounce);
    debounce = setTimeout(() => render(this.value.trim()), 200);
  });
</script>

</body>
</html>
